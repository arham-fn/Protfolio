<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8F8870" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Beige Page Background -->
  <rect width="1200" height="630" fill="#D8D2BE"/>
  <rect width="1200" height="630" fill="url(#dotgrid)"/>

  <!-- Outer 2px Bevel Border -->
  <rect x="20" y="20" width="1160" height="590" fill="#C7BFA6" stroke="#8F8870" stroke-width="4"/>
  <line x1="20" y1="20" x2="1180" y2="20" stroke="#EFEADB" stroke-width="4"/>
  <line x1="20" y1="20" x2="20" y2="610" stroke="#EFEADB" stroke-width="4"/>

  <!-- OS Window Title Bar -->
  <rect x="36" y="36" width="1128" height="42" fill="#1E3FA0"/>
  <circle cx="60" cy="57" r="7" fill="#F2541B"/>
  <text x="80" y="63" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="bold" fill="#EFEADB" letter-spacing="1">
    C:\ARHAM-OS\SYSTEM\BOOT.EXE — 1998 EDITION
  </text>
  <rect x="1116" y="44" width="26" height="26" fill="#C7BFA6" stroke="#8F8870" stroke-width="2"/>
  <text x="1124" y="62" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="bold" fill="#1A1814">✕</text>

  <!-- Big Heading -->
  <text x="60" y="170" font-family="'Bricolage Grotesque', sans-serif" font-size="76" font-weight="900" fill="#1E3FA0" letter-spacing="-2">
    ARHAM
  </text>
  <text x="350" y="170" font-family="'Bricolage Grotesque', sans-serif" font-size="76" font-weight="900" fill="#F2541B">
    // BEIGE BOX OS
  </text>

  <!-- Core Pitch Line -->
  <rect x="60" y="210" width="1080" height="65" fill="#EDE8D6" stroke="#8F8870" stroke-width="2"/>
  <text x="80" y="252" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="bold" fill="#1A1814">
    &quot;I build AI-powered apps, and I can fix the laptop you run them on.&quot;
  </text>

  <!-- 3 Floppy Drive Bays / Status Badges -->
  <g transform="translate(60, 310)">
    <!-- Flagship Tile -->
    <rect x="0" y="0" width="340" height="150" fill="#C7BFA6" stroke="#8F8870" stroke-width="2"/>
    <rect x="10" y="10" width="320" height="28" fill="#F2541B"/>
    <text x="20" y="29" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="bold" fill="#1A1814">
      ● LIVE FLAGSHIP: TECH ATLAS 2026
    </text>
    <text x="15" y="65" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#1A1814">
      Personal Tech Progression Cockpit
    </text>
    <text x="15" y="90" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1E3FA0" font-weight="bold">
      personal-tech-journey-tracker.vercel.app
    </text>
    <text x="15" y="130" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#1A1814" opacity="0.7">
      Next.js · TypeScript · Supabase · Tailwind
    </text>
  </g>

  <g transform="translate(430, 310)">
    <!-- Hardware Repair Bay Tile -->
    <rect x="0" y="0" width="340" height="150" fill="#C7BFA6" stroke="#8F8870" stroke-width="2"/>
    <rect x="10" y="10" width="320" height="28" fill="#1E3FA0"/>
    <text x="20" y="29" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="bold" fill="#EFEADB">
      🔧 8 FIXED · $0 INVOICED
    </text>
    <text x="15" y="65" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#1A1814">
      5 Laptops · 3 PCs Rescued
    </text>
    <text x="15" y="90" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1E3FA0" font-weight="bold">
      75% RAM Pin Oxidation · POST Restored
    </text>
    <text x="15" y="130" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#1A1814" opacity="0.7">
      Featured: powercfg /requests Standby Audit
    </text>
  </g>

  <g transform="translate(800, 310)">
    <!-- Identity Tile -->
    <rect x="0" y="0" width="340" height="150" fill="#C7BFA6" stroke="#8F8870" stroke-width="2"/>
    <rect x="10" y="10" width="320" height="28" fill="#EDE8D6" stroke="#8F8870" stroke-width="1"/>
    <text x="20" y="29" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="bold" fill="#1E3FA0">
      ⚡ RUNTIMES &amp; SYSTEMS
    </text>
    <text x="15" y="65" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#1A1814">
      20 Y/O · Faisalabad, PK · GCUF BS CS
    </text>
    <text x="15" y="90" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1A1814">
      Freelance AI-Integrated Apps
    </text>
    <text x="15" y="130" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#1E3FA0" font-weight="bold">
      React · React Native · Node · Python · C++
    </text>
  </g>

  <!-- Bottom Taskbar in Graphic -->
  <rect x="36" y="520" width="1128" height="46" fill="#C7BFA6" stroke="#8F8870" stroke-width="2"/>
  <rect x="46" y="526" width="110" height="34" fill="#C7BFA6" stroke="#EFEADB" stroke-width="2"/>
  <text x="62" y="548" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="bold" fill="#1A1814">
    💻 Start
  </text>
  <rect x="980" y="528" width="170" height="30" fill="#EDE8D6" stroke="#8F8870" stroke-width="1"/>
  <text x="995" y="548" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" fill="#1E3FA0">
    TURBO: 66MHz | 🏆 8/8
  </text>
</svg>
