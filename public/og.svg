  </text>

  <!-- Coordinates -->
  <text x="1120" y="580" font-family="monospace" font-size="12" fill="rgba(242,242,242,0.4)" text-anchor="end">
    FAISALABAD, PK // 31.4504° N, 73.1350° E
  </text>
